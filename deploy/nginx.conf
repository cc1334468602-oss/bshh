# ==========================================================
# bshh 前台 H5 —— Nginx 站点配置
#
# 安装：
#   cp deploy/nginx.conf /etc/nginx/conf.d/bshh.conf
#   vi /etc/nginx/conf.d/bshh.conf   # 修改下方标注 ★ 的位置
#   nginx -t && systemctl reload nginx
#
# 说明：没有域名时，server_name 直接填公网 IP 也能用。
#       没有 SSL 证书时，把 443 那段整体注释掉，只保留 80。
# ==========================================================

# ---------- HTTP ----------
server {
    listen 80;
    listen [::]:80;

    # ★ 改成你的域名，或直接填公网 IP
    server_name app.example.com;

    # ★ 已配置 HTTPS 后，取消下面两行注释，强制跳转
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/bshh.access.log;
    error_log  /var/log/nginx/bshh.error.log;

    # 上传/请求体限制
    client_max_body_size 10m;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_vary on;

    location / {
        proxy_pass http://127.0.0.1:9191;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 静态资源缓存（HTML 不缓存，避免发版后用户拿到旧页面）
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:9191;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:9191;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 健康检查不写访问日志
    location = /api/health {
        proxy_pass http://127.0.0.1:9191;
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

